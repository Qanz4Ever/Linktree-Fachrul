<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Linktree - Fahrul</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 min-h-screen flex flex-col items-center justify-center relative overflow-x-hidden font-sans select-none">

    <div class="bg-shape w-64 h-64 md:w-96 md:h-96 bg-purple-300 dark:bg-purple-900 top-[-10%] left-[-10%] animate-blob"></div>
    <div class="bg-shape w-64 h-64 md:w-96 md:h-96 bg-pink-300 dark:bg-pink-900 bottom-[-10%] right-[-10%] animate-blob animation-delay-2000"></div>
    <div class="bg-shape w-64 h-64 md:w-96 md:h-96 bg-blue-300 dark:bg-blue-900 top-[40%] left-[20%] animate-blob animation-delay-4000"></div>

    <div class="absolute top-4 right-4 md:top-8 md:right-8 z-20">
        <button id="theme-toggle" class="p-3 w-10 h-10 md:w-12 md:h-12 flex items-center justify-center rounded-full bg-white dark:bg-gray-800 shadow-xl hover:scale-110 transition-all duration-300 border border-gray-200 dark:border-gray-700">
            <i id="theme-icon" class="fas fa-moon text-gray-800 dark:text-yellow-400 text-lg md:text-xl"></i>
        </button>
    </div>

    <main class="w-full max-w-sm md:max-w-md px-6 py-12 md:py-20 flex flex-col items-center z-10">
        
        <div class="relative mb-4 md:mb-6">
            <div class="w-24 h-24 md:w-32 md:h-32 rounded-full p-1 bg-gradient-to-tr from-purple-500 via-pink-500 to-yellow-500 hover:rotate-[360deg] transition-transform duration-1000 shadow-xl cursor-pointer">
                <img src="./media/profile.png" alt="Profile Fahrul" class="w-full h-full rounded-full border-4 border-white dark:border-gray-900 object-cover">
            </div>
        </div>
        
        <h1 class="text-2xl md:text-3xl font-extrabold mb-1 tracking-tight">
            Fahrul
        </h1>
        
        <p class="text-sm md:text-base font-medium text-purple-600 dark:text-pink-400 mb-2 md:mb-4">
            @fahrul___15
        </p>
        
        <p class="text-center text-gray-500 dark:text-gray-400 mb-8 md:mb-10 max-w-xs text-xs md:text-sm">
            Selamat datang di profil saya! Hubungi dan temukan konten saya melalui link di bawah ini. ✨
        </p>

        <div class="w-full flex flex-col gap-4 md:gap-5">
            
            <a href="https://www.instagram.com/fahrul___15?igsh=MTVkY2t6OHJpdjUxNw==" target="_blank" rel="noopener noreferrer" class="group w-full p-[2px] rounded-2xl bg-gradient-to-r from-purple-500 via-pink-500 to-red-500 hover:scale-105 transition-all duration-300 block">
                <div class="flex items-center justify-between w-full bg-white dark:bg-gray-800 px-5 py-3 md:px-6 md:py-4 rounded-xl group-hover:bg-opacity-0 transition-all duration-300">
                    <div class="flex items-center gap-3 md:gap-4">
                        <div class="w-10 h-10 md:w-12 md:h-12 flex items-center justify-center rounded-full bg-pink-100 dark:bg-gray-700 group-hover:bg-white/20 transition-colors">
                            <i class="fab fa-instagram text-xl md:text-2xl text-pink-600 dark:text-pink-400 group-hover:text-white transition-colors"></i>
                        </div>
                        <span class="font-bold text-sm md:text-base text-gray-800 dark:text-white group-hover:text-white transition-colors">Instagram</span>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400 md:text-lg group-hover:text-white group-hover:translate-x-1 transition-all duration-300"></i>
                </div>
            </a>

            <a href="https://www.tiktok.com/@fahrulrazi_157?_r=1&_t=ZS-96lrq8XSWem" target="_blank" rel="noopener noreferrer" class="group w-full p-[2px] rounded-2xl bg-gradient-to-r from-gray-900 to-gray-600 dark:from-white dark:to-gray-300 hover:scale-105 transition-all duration-300 block">
                <div class="flex items-center justify-between w-full bg-white dark:bg-gray-800 px-5 py-3 md:px-6 md:py-4 rounded-xl group-hover:bg-transparent transition-all duration-300">
                    <div class="flex items-center gap-3 md:gap-4">
                        <div class="w-10 h-10 md:w-12 md:h-12 flex items-center justify-center rounded-full bg-gray-100 dark:bg-gray-700 group-hover:bg-black/10 dark:group-hover:bg-white/20 transition-colors">
                            <i class="fab fa-tiktok text-lg md:text-xl text-black dark:text-white group-hover:text-black dark:group-hover:text-black transition-colors"></i>
                        </div>
                        <span class="font-bold text-sm md:text-base text-gray-800 dark:text-white group-hover:text-white dark:group-hover:text-black transition-colors">TikTok</span>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400 md:text-lg group-hover:text-white dark:group-hover:text-black group-hover:translate-x-1 transition-all duration-300"></i>
                </div>
            </a>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
